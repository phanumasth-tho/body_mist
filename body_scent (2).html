<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า - Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Prompt:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="logo">BODY SCENT</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">หน้าแรก</a></li>
          <li><a href="product.html" class="nav-link">สินค้าทั้งหมด</a></li>
          <li><a href="admin.html" class="nav-link">ผู้ดูแลระบบ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width: 680px;">
      <div class="section-header">
        <span class="section-subtitle">CHECKOUT</span>
        <h2>แบบฟอร์มยืนยันการสั่งซื้อ</h2>
        <div class="title-underline"></div>
      </div>

      <div class="form-card">
        <form id="orderForm">
          <div class="form-group">
            <label for="items" class="form-label">รายการสินค้าที่สั่งซื้อ</label>
            <input type="text" id="items" name="items" class="form-control" readonly placeholder="กำลังโหลดข้อมูลสินค้า...">
          </div>

          <div class="form-group">
            <label for="total" class="form-label">จำนวนเงินรวมทั้งสิ้น (บาท)</label>
            <input type="text" id="total" name="total" class="form-control" readonly placeholder="0">
          </div>

          <div class="form-group">
            <label for="customerName" class="form-label">ชื่อ - นามสกุลผู้สั่งซื้อ *</label>
            <input type="text" id="customerName" name="customerName" class="form-control" required placeholder="ระบุชื่อ-นามสกุลของคุณ">
          </div>

          <div class="form-group">
            <label for="contact" class="form-label">เบอร์โทรศัพท์ / LINE ID *</label>
            <input type="text" id="contact" name="contact" class="form-control" required placeholder="ระบุเบอร์โทรศัพท์ หรือ LINE ID สำหรับติดต่อ">
          </div>

          <div class="form-group">
            <label for="note" class="form-label">หมายเหตุเพิ่มเติม (ถ้ามี)</label>
            <textarea id="note" name="note" class="form-control" rows="3" placeholder="ระบุที่อยู่จัดส่ง หรือรายละเอียดเพิ่มเติม..."></textarea>
          </div>

          <div style="margin-top: 2rem; text-align: center;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">ยืนยันการสั่งซื้อ</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-logo">BODY SCENT</div>
      <p class="footer-text">&copy; 2026 BODY SCENT. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
